name: dist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) — testado
          - os: macos-latest
            name: mac-arm64
          # macOS Intel (x64) — label comprovado no easybrawto
          - os: macos-26-intel
            name: mac-intel
          # Windows — ainda NÃO testado
          - os: windows-latest
            name: win
          # Linux — ainda NÃO testado
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: broll-${{ matrix.name }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            broll-mac-arm64/*.dmg
            broll-mac-arm64/*.zip
            broll-mac-intel/*.dmg
            broll-mac-intel/*.zip
            broll-win/*.exe
            broll-linux/*.AppImage
            broll-linux/*.deb
