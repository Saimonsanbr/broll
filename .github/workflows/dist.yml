name: dist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) — testado
          - os: macos-latest
            name: mac-arm64
          # macOS Intel (x64) — label comprovado no easybrawto
          - os: macos-26-intel
            name: mac-intel
          # Windows — ainda NÃO testado
          - os: windows-latest
            name: win
          # Linux — ainda NÃO testado
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
      IM_URL: https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-36/ImageMagick-7.1.2-36-portable-Q16-HDRI-x64.7z
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.name == 'win'
        name: bundle ffmpeg + magick (windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/win | Out-Null
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff-tmp
          Copy-Item ff-tmp/*/bin/ffmpeg.exe bin/win/
          Invoke-WebRequest -Uri $env:IM_URL -OutFile magick.7z
          & "C:\Program Files\7-Zip\7z.exe" x magick.7z -oim-tmp | Out-Null
          $magick = Get-ChildItem -Recurse -Path im-tmp -Filter magick.exe | Select-Object -First 1
          Copy-Item $magick.FullName bin/win/
          Copy-Item (Join-Path $magick.DirectoryName '*.dll') bin/win/
          Remove-Item -Recurse -Force ff-tmp, im-tmp, ffmpeg.zip, magick.7z
          Get-ChildItem bin/win
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: broll-${{ matrix.name }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            broll-mac-arm64/*.dmg
            broll-mac-arm64/*.zip
            broll-mac-intel/*.dmg
            broll-mac-intel/*.zip
            broll-win/*.exe
            broll-linux/*.AppImage
            broll-linux/*.deb
